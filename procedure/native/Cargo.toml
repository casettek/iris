[package]
name = "procedure-native"
version = "0.1.0"
edition = "2021"
description = "The direct run of a procedure: its result as fast as possible"

[features]
gpu-kernels = ["inference-generation/gpu-kernels", "procedure-pipeline/gpu-kernels"]

[dependencies]
procedure-prepare = { path = "../prepare" }
anyhow = "1.0"
inference-generation = { path = "../../phases/inference/generation" }
procedure-definition = { path = "../definition" }
procedure-pipeline = { path = "../pipeline" }

[dev-dependencies]
inference-kernels = { path = "../../phases/inference/kernels" }
inference-manifest = { path = "../../phases/inference/manifest" }
prefill-range = { path = "../../raster-stages/prefill-range" }
raster = { path = "../../../raster/crates/raster" }
sequence-check = { path = "../../raster-stages/sequence-check" }
sha2 = "0.10"
serde_json = "1.0"
