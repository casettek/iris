[package]
name = "blockchain-rules"
version = "0.1.0"
edition = "2021"
description = "What a claim, a challenge and a contract hold, and the contract's rules in Rust"

[dependencies]
anyhow = "1.0"
hex = "0.4"
postcard = { version = "1", default-features = false, features = ["alloc"] }
raster-core = { path = "../../../raster/crates/raster-core" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
toml = "0.8"

common-identity = { path = "../../phases/common/identity" }
inference-manifest = { path = "../../phases/inference/manifest" }
procedure-definition = { path = "../../procedure/definition" }
inference-tokenizer = { path = "../../phases/inference/tokenizer" }
result-phase = { path = "../../phases/result" }
source-phase = { path = "../../phases/source" }

[dev-dependencies]
source-phase = { path = "../../phases/source", features = ["sign"] }
