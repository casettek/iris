[package]
name = "procedure-run"
version = "0.1.0"
edition = "2021"
description = "A procedure run with no blockchain: its direct result, then a staged run with a checkpoint per stage"

[features]
gpu-kernels = ["procedure-direct/gpu-kernels", "staged-infer/gpu-kernels"]

[dependencies]
anyhow = "1.0"
procedure-definition = { path = "../definition" }
procedure-direct = { path = "../direct" }
run-prep = { path = "../prepare" }
serde_json = "1.0"
staged-infer = { path = "../staged" }
