# The same inference on two models, one after the other, and whether their
# outputs agree.

[[step]]
name = "source"
segment = "source"
program = "prompt-source"

[[step]]
name = "first"
segment = "inference"
inputs.source = "source"

[[step]]
name = "second"
segment = "inference"
inputs.source = "source"

[[step]]
name = "result"
segment = "result"
program = "consensus-result"
inputs.first = "first"
inputs.second = "second"
