[package]
name = "iris-cli"
version = "0.1.0"
edition = "2021"
default-run = "iris"

[[bin]]
name = "iris"
path = "src/main.rs"

[features]
cuda = ["blockchain-host/cuda", "testing/cuda"]
gpu-kernels = ["direct-infer/gpu-kernels", "staged-infer/gpu-kernels", "blockchain-host/gpu-kernels", "testing/gpu-kernels", "procedure-direct/gpu-kernels"]
replay-profile = []

[dependencies]
anyhow = "1.0"
blockchain-host = { path = "../blockchain/host" }
blockchain-rules = { path = "../blockchain/rules" }
clap = { version = "4.5", features = ["derive"] }
direct-infer = { path = "../segments/inference/generation" }
model-identity = { path = "../segments/common/identity" }
model-import = { path = "../segments/inference/import" }
model-manifest = { path = "../segments/inference/manifest" }
procedure-definition = { path = "../procedure/definition" }
procedure-direct = { path = "../procedure/direct" }
raster-analysis = { path = "../../raster/crates/raster-analysis" }
raster-runtime = { path = "../../raster/crates/raster-runtime" }
run-prep = { path = "../procedure/prepare" }
serde_json = "1.0"
source-core = { path = "../segments/source", features = ["sign"] }
staged-infer = { path = "../procedure/staged" }
testing = { path = "../testing" }
toml = "0.8"

[dev-dependencies]
hex = "0.4"
postcard = { version = "1", features = ["alloc"] }
raster = { path = "../../raster/crates/raster" }
raster-backend = { path = "../../raster/crates/raster-backend" }
raster-backend-risc0 = { path = "../../raster/crates/raster-backend-risc0" }
raster-compiler = { path = "../../raster/crates/raster-compiler" }
sequence-check = { path = "../raster-stages/sequence-check" }
serde = { version = "1.0", features = ["derive"] }
