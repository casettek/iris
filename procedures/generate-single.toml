# Finds one model's output on a case, and states the code of the form it is.
#
# A generation runs natively and has no stage programs. A step's `program`
# names which logic of its phase the step is.

[[step]]
name = "source"
segment = "source"
program = "prompt-source"

[[step]]
name = "inference"
segment = "generation"
inputs.source = "source"

[[step]]
name = "result"
segment = "result"
program = "claim-result"
inputs.check = "inference"
