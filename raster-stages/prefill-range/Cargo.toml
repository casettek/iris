[package]
name = "prefill-range"
version = "0.1.0"
edition = "2021"
default-run = "prefill-range"

[features]
default = ["std"]
std = ["raster/std"]
profiling = ["raster/profiling"]

[dependencies]
raster = { path = "../../../raster/crates/raster", default-features = false }
serde = { version = "1.0", default-features = false, features = ["derive", "alloc"] }
# Canonical fixed-point kernels, vendored verbatim from the reference
# implementation and held to bit-equality by `det-num/tests/equivalence.rs`.
det-num = { path = "../../crates/det-num" }

[dev-dependencies]
raster-runtime = { path = "../../../raster/crates/raster-runtime" }
