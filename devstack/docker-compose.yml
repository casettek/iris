# The local chains iris integrates against: a single-validator Celestia with a
# bridge node, and an EVM node. See README.md in this directory.
name: iris-devstack

services:
  celestia-validator:
    # celestia-app 10.6.0
    image: ghcr.io/celestiaorg/celestia-app@sha256:7d2fa11f5be9096a8e0fa388215626a2f45bbc8c90c5657b0dec7cec9399250d
    entrypoint: ["/bin/bash", "/devstack/validator.sh"]
    volumes:
      - ./celestia:/devstack:ro
      - validator:/home/celestia
    ports:
      - "127.0.0.1:${IRIS_CELESTIA_RPC_PORT:-26657}:26657"
      - "127.0.0.1:${IRIS_CELESTIA_GRPC_PORT:-9090}:9090"
    healthcheck:
      # The latest block, and not a fixed early one: the validator prunes old
      # blocks, and a check of one of those fails on a chain that is running.
      test: ["CMD-SHELL", "curl -sf http://localhost:26657/block | jq -e '(.result.block.header.height | tonumber) >= 2' > /dev/null"]
      interval: 2s
      timeout: 5s
      retries: 60

  celestia-bridge:
    # celestia-node 0.35.0
    image: ghcr.io/celestiaorg/celestia-node@sha256:59e0ae50a769fcad513162366f8d07ac25322fae1de97ab8b118ff8043e3ff09
    entrypoint: ["/bin/bash", "/devstack/bridge.sh"]
    depends_on:
      celestia-validator:
        condition: service_healthy
    volumes:
      - ./celestia:/devstack:ro
      - validator:/validator:ro
      - bridge:/home/celestia
    ports:
      - "127.0.0.1:${IRIS_CELESTIA_NODE_PORT:-26658}:26658"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf -X POST -H \"Content-Type: application/json\" -d \"{\\\"jsonrpc\\\":\\\"2.0\\\",\\\"id\\\":1,\\\"method\\\":\\\"header.LocalHead\\\",\\\"params\\\":[]}\" http://localhost:26658 | jq -e .result.header.height > /dev/null"]
      interval: 2s
      timeout: 5s
      retries: 90

  evm:
    # Foundry 1.9.0: anvil
    image: ghcr.io/foundry-rs/foundry@sha256:3a392c18f9b16e665e932de159fb6fa9ed972c4b4352f2f76a1a8c7ca9b57d39
    entrypoint: ["anvil", "--host", "0.0.0.0", "--chain-id", "31337"]
    ports:
      - "127.0.0.1:${IRIS_EVM_PORT:-8545}:8545"
    healthcheck:
      test: ["CMD-SHELL", "cast block-number --rpc-url http://localhost:8545 > /dev/null"]
      interval: 2s
      timeout: 5s
      retries: 30

volumes:
  validator:
  bridge:
