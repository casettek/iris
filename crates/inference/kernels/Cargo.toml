[package]
name = "inference-kernels"
version = "0.1.0"
edition = "2021"

[features]
# Runs the layer's Q8_0 matrix products on an NVIDIA GPU, with results
# identical to the CPU's. Building it needs the CUDA toolkit (see build.rs).
gpu-kernels = []

[dependencies]
model-identity = { path = "../../model/identity", default-features = false }
anyhow = "1.0"
det-num = { path = "../../det-num" }
input-embedding = { path = "../../../raster-stages/input-embedding" }
output-finalize = { path = "../../../raster-stages/output-finalize" }
prefill-range = { path = "../../../raster-stages/prefill-range" }
prefill-prepare-aux = { path = "../../../raster-stages/prefill-prepare-aux" }
prompt-check = { path = "../../../raster-stages/prompt-check" }
sequence-check = { path = "../../../raster-stages/sequence-check" }
raster = { path = "../../../../raster/crates/raster" }
rayon = "1.10"
sha2 = "0.10"
serde = { version = "1.0", features = ["derive"] }
