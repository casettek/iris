# Finds two models' outputs on the same case, one after the other, and
# states whether they agree.
#
# A generation runs natively and has no stage programs. A step's `program`
# names which logic of its phase the step is.

[[step]]
name = "source"
segment = "source"
program = "prompt-source"

[[step]]
name = "first"
segment = "generation"
inputs.source = "source"

[[step]]
name = "second"
segment = "generation"
inputs.source = "source"

[[step]]
name = "result"
segment = "result"
program = "consensus-result"
inputs.first = "first"
inputs.second = "second"
