[package]
name = "prompt-core"
version = "0.1.0"
edition = "2021"
description = "Tests for the prompt source each prompt stage compiles as its own module"

[features]
default = ["std"]
std = ["raster/std"]

[dependencies]
raster = { path = "../../../raster/crates/raster", default-features = false }
serde = { version = "1.0", default-features = false, features = ["derive", "alloc"] }
sha2 = { version = "0.10", default-features = false, features = ["compress"] }
