[package]
name = "blockchain-host"
version = "0.1.0"
edition = "2021"
description = "What a claimer, a challenger and a defender do on the host, for a claim settled on blockchains"

[features]
cuda = ["risc0-zkvm/cuda", "raster-backend-risc0/cuda"]
gpu-kernels = ["inference-generation/gpu-kernels", "procedure-pipeline/gpu-kernels"]

[dependencies]
procedure-run = { path = "../../procedure/run" }
anyhow = "1.0"
blockchain-rules = { path = "../rules" }
clap = { version = "4.5", features = ["derive"] }
inference-generation = { path = "../../phases/inference/generation" }
hex = "0.4"
blockchain-celestia = { path = "../celestia" }
blockchain-evm = { path = "../evm" }
k256 = { version = "0.13", default-features = false, features = ["ecdsa"] }
inference-manifest = { path = "../../phases/inference/manifest" }
postcard = { version = "1", features = ["alloc"] }
procedure-definition = { path = "../../procedure/definition" }
raster = { path = "../../../raster/crates/raster" }
raster-analysis = { path = "../../../raster/crates/raster-analysis" }
raster-backend-risc0 = { path = "../../../raster/crates/raster-backend-risc0" }
raster-compiler = { path = "../../../raster/crates/raster-compiler" }
raster-core = { path = "../../../raster/crates/raster-core" }
raster-prover = { path = "../../../raster/crates/raster-prover" }
raster-runtime = { path = "../../../raster/crates/raster-runtime" }
result-phase = { path = "../../phases/result" }
risc0-zkvm = { version = "3.0", default-features = false, features = ["prove", "std"] }
procedure-prepare = { path = "../../procedure/prepare" }
inference-prompt = { path = "../../phases/inference/prompt" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
source-phase = { path = "../../phases/source", features = ["sign"] }
procedure-pipeline = { path = "../../procedure/pipeline" }
toml = "0.8"
