[package]
name = "procedure-run"
version = "0.1.0"
edition = "2021"
description = "A procedure run with no blockchain: its native result, then a pipeline run with a checkpoint per stage"

[features]
gpu-kernels = ["procedure-native/gpu-kernels", "procedure-pipeline/gpu-kernels"]

[dependencies]
anyhow = "1.0"
procedure-definition = { path = "../definition" }
procedure-native = { path = "../native" }
procedure-prepare = { path = "../prepare" }
serde_json = "1.0"
procedure-pipeline = { path = "../pipeline" }
