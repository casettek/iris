[package]
name = "prompt-relay"
version = "0.1.0"
edition = "2021"
default-run = "prompt-relay"

[features]
default = ["std"]
std = ["raster/std"]
profiling = ["raster/profiling"]
# Named by the shared source file, for the host signer. Never enabled here.
sign = []

[dependencies]
model-identity = { path = "../../phases/common/identity", default-features = false }
raster = { path = "../../../raster/crates/raster", default-features = false }
serde = { version = "1.0", default-features = false, features = ["derive", "alloc"] }
sha2 = { version = "0.10", default-features = false, features = ["compress"] }
k256 = { version = "0.13", default-features = false, features = ["ecdsa"] }

[[bin]]
name = "prompt-relay"
path = "src/main.rs"
required-features = ["std"]
