[package]
name = "procedure-prepare"
version = "0.1.0"
edition = "2021"
description = "A run's inputs: its text and source, and the files its stages load"

[dependencies]
postcard = { version = "1", features = ["alloc"] }
inference-tokenizer = { path = "../../phases/inference/tokenizer" }
sha2 = "0.10"
hex = "0.4"
toml = "0.8"
anyhow = "1.0"
input-embedding = { path = "../../raster-stages/input-embedding" }
inference-manifest = { path = "../../phases/inference/manifest" }
procedure-definition = { path = "../definition" }
prompt-check = { path = "../../raster-stages/prompt-check" }
inference-prompt = { path = "../../phases/inference/prompt" }
raster = { path = "../../../raster/crates/raster" }
result-phase = { path = "../../phases/result" }
serde = "1.0"
serde_json = "1.0"
source-phase = { path = "../../phases/source" }

[dev-dependencies]
inference-kernels = { path = "../../phases/inference/kernels" }
