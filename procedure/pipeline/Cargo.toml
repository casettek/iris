[package]
name = "procedure-pipeline"
version = "0.1.0"
edition = "2021"
default-run = "procedure-pipeline"

[[bin]]
name = "procedure-pipeline"
path = "src/main.rs"

[features]
# Layer matrix products on an NVIDIA GPU; see inference-kernels.
gpu-kernels = ["inference-kernels/gpu-kernels"]

[dependencies]
common-identity = { path = "../../phases/common/identity", default-features = false }
inference-kernels = { path = "../../phases/inference/kernels" }
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
inference-numerics = { path = "../../phases/inference/numerics" }
hex = "0.4"
input-embedding = { path = "../../raster-stages/input-embedding" }
procedure-definition = { path = "../definition" }
prefill-range = { path = "../../raster-stages/prefill-range" }
layer-mistral = { path = "../../raster-stages/layer-mistral" }
prefill-prepare-aux = { path = "../../raster-stages/prefill-prepare-aux" }
prompt-check = { path = "../../raster-stages/prompt-check" }
sequence-check = { path = "../../raster-stages/sequence-check" }
claim-result = { path = "../../raster-stages/claim-result" }
consensus-result = { path = "../../raster-stages/consensus-result" }
source-phase = { path = "../../phases/source" }
raster = { path = "../../../raster/crates/raster" }
raster-core = { path = "../../../raster/crates/raster-core" }
raster-runtime = { path = "../../../raster/crates/raster-runtime" }
rayon = "1.10"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
toml = "0.8"
sysinfo = { version = "0.33", default-features = false, features = ["system"] }

[dev-dependencies]
inference-prompt = { path = "../../phases/inference/prompt" }
