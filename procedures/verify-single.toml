# Verifies one model's stated output on a case, and states the code of the
# form that output is. What a specification that names no procedure kind
# runs.

[[step]]
name = "source"
segment = "source"
program = "prompt-source"

[[step]]
name = "inference"
segment = "inference"
inputs.source = "source"

[[step]]
name = "result"
segment = "result"
program = "claim-result"
inputs.check = "inference"
