[package]
name = "sequence-check"
version = "0.1.0"
edition = "2021"
default-run = "sequence-check"

[features]
default = ["std"]
std = ["raster/std"]
profiling = ["raster/profiling"]

[dependencies]
model-identity = { path = "../../crates/model/identity", default-features = false }
raster = { path = "../../../raster/crates/raster", default-features = false }
serde = { version = "1.0", default-features = false, features = ["derive", "alloc"] }
# Canonical fixed-point kernels, vendored verbatim from the reference.
det-num = { path = "../../crates/det-num" }
# The shared prompt source hashes with the guest-accelerated compression function.
sha2 = { version = "0.10", default-features = false, features = ["compress"] }

# Sequences run on the host; only the library is built for proof guests.
[[bin]]
name = "sequence-check"
path = "src/main.rs"
required-features = ["std"]
