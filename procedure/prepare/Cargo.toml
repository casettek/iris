[package]
name = "run-prep"
version = "0.1.0"
edition = "2021"
description = "A run's inputs: its text and source, and the files its stages load"

[dependencies]
postcard = { version = "1", features = ["alloc"] }
prompt-core = { path = "../../segments/inference/tokenizer" }
sha2 = "0.10"
hex = "0.4"
toml = "0.8"
anyhow = "1.0"
input-embedding = { path = "../../raster-stages/input-embedding" }
model-manifest = { path = "../../segments/inference/manifest" }
procedure-definition = { path = "../definition" }
prompt-check = { path = "../../raster-stages/prompt-check" }
prompt-prep = { path = "../../segments/inference/prompt" }
raster = { path = "../../../raster/crates/raster" }
result-core = { path = "../../segments/result" }
serde = "1.0"
serde_json = "1.0"
source-core = { path = "../../segments/source" }

[dev-dependencies]
inference-kernels = { path = "../../segments/inference/kernels" }
